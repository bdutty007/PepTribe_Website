<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scout Membership</title>

  <meta
    name="description"
    content="Calculate your exact peptide reconstitution dosage. Select your syringe, vial quantity, bacteriostatic water, and desired dose."
  >

  <!-- ==========================================
       PEPTRIBE FONTS
  ========================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    /* ==========================================
       PEPTRIBE VARIABLES
    ========================================== */

    :root{

      --teal:#20C9D9;
      --purple:#6B4FBB;
      --orange:#FF8C42;

      --navy:#1A2B4A;
      --navy-m:#243760;

      --white:#FFFFFF;

      --fh:'Poppins',sans-serif;
      --fb:'Inter',sans-serif;

    }


    /* ==========================================
       RESET
    ========================================== */

    *,
    *::before,
    *::after{

      box-sizing:border-box;

      margin:0;
      padding:0;

    }


    html{

      scroll-behavior:smooth;

    }


    body{

      margin:0;

      font-family:var(--fb);

      color:var(--navy);

      background:#F6F9FC;

      overflow-x:hidden;

      line-height:1.6;

    }


    a{

      text-decoration:none;

      color:inherit;

    }


    /* ==========================================
       NAVIGATION
    ========================================== */

    .calc-nav{

      height:54px;

      width:100%;

      background:var(--navy);

      position:sticky;

      top:0;

      z-index:1000;

      display:grid;

      grid-template-columns:1fr auto 1fr;

      align-items:center;

      padding:0 40px;

      box-shadow:
        0 4px 20px rgba(10,18,35,.4);

    }


    /* ==========================================
       LEFT SIDE
    ========================================== */

    .calc-nav-left{

      display:flex;

      align-items:center;

      justify-content:flex-start;

      min-width:0;

    }


    .calc-nav .back{

      display:flex;

      align-items:center;

      gap:6px;

      font-family:var(--fh);

      font-size:13px;

      font-weight:500;

      color:rgba(255,255,255,.6);

      padding:6px 16px;

      border-radius:8px;

      white-space:nowrap;

      transition:all .2s ease;

    }


    .calc-nav .back:hover{

      color:var(--teal);

      background:rgba(32,201,217,.1);

    }


    /* ==========================================
       CENTER LOGO
    ========================================== */

    .calc-nav-center{

      display:flex;

      align-items:center;

      justify-content:center;

    }


    .calc-nav .logo{

      display:block;

      font-family:var(--fh);

      font-size:18px;

      font-weight:800;

      line-height:1;

      color:#FFFFFF;

      white-space:nowrap;

    }


    .calc-nav .logo span{

      color:var(--teal);

    }


    /* ==========================================
       RIGHT SIDE
    ========================================== */

    .calc-nav-right{

      display:flex;

      align-items:center;

      justify-content:flex-end;

      gap:4px;

      min-width:0;

    }


    /* ==========================================
       PROTOCOL DROPDOWN
    ========================================== */

    .calc-nav .nav-drop{

      position:relative;

      list-style:none;

    }


    .calc-nav .nav-drop>a{

      display:block;

      cursor:pointer;

      font-family:var(--fh);

      font-size:14px;

      font-weight:600;

      color:rgba(255,255,255,.8);

      padding:6px 16px;

      border-radius:8px;

      transition:all .2s ease;

      white-space:nowrap;

    }


    .calc-nav .nav-drop>a:hover{

      color:var(--teal);

      background:rgba(32,201,217,.1);

    }


    .calc-nav .nav-drop-menu{

      display:none;

      position:absolute;

      top:calc(100% + 4px);

      right:0;

      min-width:200px;

      background:#0F1E36;

      border:1px solid rgba(255,255,255,.1);

      border-radius:12px;

      padding:8px;

      box-shadow:
        0 12px 40px rgba(0,0,0,.4);

      z-index:2000;

    }


    .calc-nav .nav-drop:hover .nav-drop-menu{

      display:flex;

      flex-direction:column;

      gap:2px;

    }


    .calc-nav .nav-drop-menu a{

      display:flex;

      align-items:center;

      gap:8px;

      font-family:var(--fh);

      font-size:13px;

      font-weight:600;

      color:rgba(255,255,255,.8);

      padding:10px 14px;

      border-radius:8px;

      white-space:nowrap;

      transition:all .2s ease;

    }


    .calc-nav .nav-drop-menu a:hover{

      color:var(--teal);

      background:rgba(32,201,217,.1);

    }


    /* ==========================================
       LOGIN BUTTON
    ========================================== */

    .calc-login{

      display:inline-flex !important;

      align-items:center;

      justify-content:center;

      font-family:var(--fb) !important;

      font-size:13px !important;

      font-weight:700 !important;

      color:rgba(255,255,255,.85) !important;

      padding:7px 18px !important;

      border-radius:50px !important;

      border:2px solid rgba(255,255,255,.4) !important;

      white-space:nowrap;

      transition:all .2s ease;

    }


    .calc-login:hover{

      color:var(--teal) !important;

      border-color:var(--teal) !important;

      background:rgba(32,201,217,.08) !important;

    }


    /* ==========================================
       HERO
    ========================================== */

    .calc-hero{

      width:100%;

      background:
        linear-gradient(
          135deg,
          var(--navy) 0%,
          var(--navy-m) 100%
        );

      padding:56px 40px;

      text-align:center;

      position:relative;

      overflow:hidden;

    }


    /* ==========================================
       HERO GLOW
    ========================================== */

    .calc-hero::before{

      content:"";

      position:absolute;

      inset:0;

      background:
        radial-gradient(
          ellipse 60% 80% at 50% 50%,
          rgba(32,201,217,.10) 0%,
          transparent 70%
        );

      pointer-events:none;

    }


    .calc-hero-inner{

      position:relative;

      z-index:2;

      max-width:700px;

      margin:0 auto;

    }


    /* ==========================================
       HERO BADGE
    ========================================== */

    .calc-hero .badge{

      display:inline-flex;

      align-items:center;

      justify-content:center;

      gap:8px;

      background:rgba(32,201,217,.12);

      border:1px solid rgba(32,201,217,.3);

      color:var(--teal);

      font-family:var(--fh);

      font-size:11px;

      font-weight:700;

      letter-spacing:.18em;

      text-transform:uppercase;

      padding:6px 16px;

      border-radius:50px;

      margin-bottom:20px;

    }


    /* ==========================================
       HERO TITLE
    ========================================== */

    .calc-hero h1{

      font-family:var(--fh);

      font-size:clamp(28px,4vw,48px);

      font-weight:900;

      color:#FFFFFF;

      margin:0 0 14px;

      line-height:1.1;

      letter-spacing:-.02em;

    }


    .calc-hero h1 span{

      color:var(--teal);

    }


    /* ==========================================
       HERO DESCRIPTION
    ========================================== */

    .calc-hero p{

      font-family:var(--fb);

      font-size:16px;

      color:rgba(255,255,255,.65);

      max-width:520px;

      margin:0 auto;

      line-height:1.7;

    }


    /* ==========================================
       JOIN SCOUT BUTTON
    ========================================== */

    .join-scout-btn{

      display:inline-flex;

      align-items:center;

      justify-content:center;

      gap:10px;

      margin-top:26px;

      padding:13px 25px;

      background:var(--teal);

      color:#FFFFFF;

      font-family:var(--fh);

      font-size:14px;

      font-weight:700;

      line-height:1;

      border-radius:50px;

      text-decoration:none;

      box-shadow:
        0 8px 24px rgba(32,201,217,.25);

      transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;

    }


    .join-scout-btn span{

      font-size:18px;

      line-height:1;

      transition:
        transform .25s ease;

    }


    .join-scout-btn:hover{

      background:var(--purple);

      color:#FFFFFF;

      transform:translateY(-2px);

      box-shadow:
        0 12px 30px rgba(107,79,187,.28);

    }


    .join-scout-btn:hover span{

      transform:translateX(4px);

    }


    /* ==========================================
       TABLET
    ========================================== */

    @media(max-width:900px){

      .calc-nav{

        padding:0 24px;

      }

    }


    /* ==========================================
       MOBILE
    ========================================== */

    @media(max-width:700px){

      .calc-nav{

        height:54px;

        padding:0 15px;

        grid-template-columns:auto 1fr auto;

      }


      .calc-nav-left{

        justify-content:flex-start;

      }


      .calc-nav-center{

        justify-content:center;

      }


      .calc-nav-right{

        justify-content:flex-end;

      }


      .calc-nav .back{

        font-size:11px;

        padding:6px 5px;

      }


      .calc-nav .logo{

        font-size:16px;

      }


      .calc-nav .nav-drop>a{

        font-size:12px;

        padding:6px 7px;

      }


      .calc-login{

        font-size:11px !important;

        padding:6px 12px !important;

      }


      .calc-hero{

        padding:42px 20px;

      }


      .calc-hero .badge{

        font-size:10px;

        letter-spacing:.15em;

        margin-bottom:17px;

      }


      .calc-hero h1{

        font-size:34px;

        line-height:1.1;

        margin-bottom:13px;

      }


      .calc-hero p{

        font-size:15px;

        line-height:1.7;

      }


      .join-scout-btn{

        margin-top:22px;

        padding:12px 23px;

        font-size:13px;

      }

    }


    /* ==========================================
       SMALL MOBILE
    ========================================== */

    @media(max-width:500px){

      .calc-nav{

        padding:0 10px;

      }


      .calc-nav .back{

        font-size:10px;

        padding-left:2px;

        padding-right:2px;

      }


      .calc-nav .logo{

        font-size:15px;

      }


      .calc-nav .nav-drop>a{

        font-size:11px;

        padding-left:4px;

        padding-right:4px;

      }


      .calc-login{

        font-size:10px !important;

        padding:5px 9px !important;

      }


      .calc-hero{

        padding:38px 18px;

      }


      .calc-hero h1{

        font-size:31px;

      }

    }


    /* ==========================================
       VERY SMALL MOBILE
    ========================================== */

    @media(max-width:390px){

      .calc-nav .back{

        font-size:9px;

      }


      .calc-nav .logo{

        font-size:14px;

      }


      .calc-nav .nav-drop>a{

        font-size:10px;

      }


      .calc-login{

        font-size:9px !important;

        padding:5px 7px !important;

      }

    }

  </style>

</head>


<body>


  <!-- ==========================================
       NAVIGATION
  ========================================== -->

  <nav
    class="calc-nav"
    aria-label="Calculator navigation"
  >


    <!-- LEFT -->

    <div class="calc-nav-left">

      <a
        href="https://peptribe.us/home"

      >
        ← Back to PepTribe
      </a>

    </div>


    <!-- CENTER -->

    <div class="calc-nav-center">

      <a
        href="https://peptribe.us/home"

      >
        Pep<span>Tribe</span>

    </div>


    <!-- RIGHT -->

    <div class="calc-nav-right">


      <!-- PROTOCOLS -->

      <div class="nav-drop">

        <a href="#">
          Protocols ▾
        </a>


        <div class="nav-drop-menu">

          <a href="https://peptribe.us/calculator">
            🧪 Calculator
          </a>


          <a
            href="https://app.peptribe.us/research/peptides"

          </a>

        </div>

      </div>


      <!-- LOGIN -->

      <a
        href="https://peptribe.app.clientclub.net/login"
        target="_blank"
        rel="noopener"
        class="calc-login"
      >
        Login
      </a>


    </div>

  </nav>



  <!-- ==========================================
       HERO
  ========================================== -->

  <section class="calc-hero">

    <div class="calc-hero-inner">


      <div class="badge">

        💉 SCOUT MEMBERSHIP

      </div>


      <h1>

        Start Your Journey Into Smarter <span>Wellness</span>

      </h1>


      <p>

        Explore peptide science, research, and real conversations with a community built for curious minds seeking science, community, and clarity.

      </p>


      <!-- JOIN SCOUT -->

      <a
        href="#one-step-order-cTmWcvHCpH"
        class="join-scout-btn"
      >

        Join Scout

        <span>→</span>

      </a>


    </div>

  </section>


</body>
</html>
